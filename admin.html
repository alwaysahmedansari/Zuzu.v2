<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Feedback inbox — ZUZU</title>
<style>:root{--bg:#fbf8f1;--ink:#1d1b3a;--mut:#5a5878;--pri:#5b4bdb}@media(prefers-color-scheme:dark){:root{--bg:#12112a;--ink:#f4f2ff;--mut:#b6b3dc;--pri:#9d90ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:16px clamp(16px,4vw,40px);border-bottom:2px solid var(--ink)}header a{font:800 26px system-ui;color:var(--ink);text-decoration:none}header span{color:var(--pri)}header em{font-size:13px;color:var(--mut);font-style:normal}
main{max-width:760px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 60px}button{font:600 13px system-ui;padding:6px 14px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;margin:0 6px 6px 0}button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
article{border:2px solid var(--ink);border-radius:18px;padding:16px;margin:0 0 16px;box-shadow:4px 4px 0 var(--ink)}.top{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}time{margin-left:auto;font-size:12px;color:var(--mut)}article p{white-space:pre-wrap;margin:10px 0 12px}a{color:var(--pri)}</style></head><body>
<header><a href="index.html">zuzu<span>.</span></a><em>Admin · Feedback inbox</em></header>
<main><div id="msg">Loading…</div><div id="tabs"></div><div id="list"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const sb = supabase.createClient(ZUZU_CONFIG.url, ZUZU_CONFIG.key);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
let rows = [], filter = 'new';
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { msg.innerHTML = 'Please <a href="index.html">sign in on the main site</a> with the admin account, then reopen this page.'; return; }
  const { data: a } = await sb.from('admins').select('user_id');
  if (!a || !a.length) { msg.textContent = 'This account does not have admin access.'; return; }
  msg.remove(); load();
}
async function load() {
  const { data, error } = await sb.from('support_messages').select('*').order('created_at', { ascending: false }).limit(300);
  if (error) { list.textContent = error.message; return; }
  rows = data; draw();
}
function draw() {
  tabs.innerHTML = ['new', 'read', 'resolved', 'all'].map(f => '<button class="' + (f === filter ? 'on' : '') + '" data-f="' + f + '">' + f + ' (' + (f === 'all' ? rows.length : rows.filter(r => r.status === f).length) + ')</button>').join('');
  const r = rows.filter(x => filter === 'all' || x.status === filter);
  list.innerHTML = r.length ? r.map(x => '<article><div class="top"><b>' + esc(x.name) + '</b><a href="mailto:' + esc(x.email) + '?subject=Re:%20Your%20message%20to%20ZUZU">' + esc(x.email) + '</a><time>' + new Date(x.created_at).toLocaleString() + '</time></div><p>' + esc(x.message) + '</p>' + ['new', 'read', 'resolved'].map(s => '<button data-id="' + x.id + '" data-s="' + s + '" class="' + (x.status === s ? 'on' : '') + '">' + s + '</button>').join('') + '</article>').join('') : '<p>No messages here.</p>';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { filter = b.dataset.f; draw(); }
  if (b.dataset.id) { await sb.from('support_messages').update({ status: b.dataset.s }).eq('id', b.dataset.id); load(); }
});
init();
</script></body></html>
