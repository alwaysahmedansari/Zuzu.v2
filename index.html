<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ZUZU — A world of words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">zuzu<span>.</span></div>
    <nav class="nav">
      <button class="active" data-view="Home">
        <svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </button>
      <button data-view="Write">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Write
      </button>
      <button data-view="Library">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Library
      </button>
    </nav>

    <div class="side-note">
      <strong>Good thoughts live here.</strong>
      Read something unexpected. Share something meaningful.
    </div>

    <div class="side-bottom">
      <button data-view="Account">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        Account
      </button>
      <button data-view="Settings">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- Main Container -->
  <main>
    <header class="topbar">
      <div class="mobile-logo">zuzu<span>.</span></div>
      <label class="searchbox">
        <svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Search essays, stories, authors..." autocomplete="off">
        <span class="search-badge">⌘K</span>
      </label>

      <div class="top-actions">
        <button class="btn-icon" id="themeToggle" title="Toggle theme">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <div class="avatar" id="avatarBtn" title="Your Account">AK</div>
      </div>
    </header>

    <div class="content">
      <div class="hero">
        <div>
          <div class="eyebrow">A World of Words</div>
          <h1 id="pageTitle">Better thoughts.<br>Brighter days.</h1>
          <p id="pageSubtitle">Stories, essays, and deep reflections from voices around the globe.</p>
        </div>
        <div class="hero-bear" aria-hidden="true"></div>
      </div>

      <div class="topic-row" id="topicBar">
        <button class="topic-btn active" data-topic="All">All</button>
        <button class="topic-btn" data-topic="Essays">Essays</button>
        <button class="topic-btn" data-topic="Stories">Stories</button>
        <button class="topic-btn" data-topic="Technology">Technology</button>
        <button class="topic-btn" data-topic="Life">Life</button>
        <button class="topic-btn" data-topic="Culture">Culture</button>
        <button class="topic-btn" data-topic="Travel">Travel</button>
        <button class="topic-btn" data-topic="Urdu">اردو (Urdu)</button>
      </div>

      <div class="feed-head">
        <h2 id="feedTitle">Latest stories</h2>
        <select class="sort-select" id="sortSelect">
          <option value="recent">Most Recent</option>
          <option value="popular">Most Applauded</option>
          <option value="readTime">Quick Reads</option>
        </select>
      </div>

      <div class="feed" id="feedContainer"></div>
    </div>
  </main>
</div>

<!-- Mobile Bottom Navigation -->
<nav class="bottom-nav">
  <button class="active" data-view="Home">
    <svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>Home</span>
  </button>
  <button data-view="Write">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    <span>Write</span>
  </button>
  <button data-view="Library">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span>Saved</span>
  </button>
  <button data-view="Account">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/></svg>
    <span>You</span>
  </button>
</nav>

<!-- Reader / Writer Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast">Saved to library</div>

<script>
// Default Seed Articles
const defaultStories = [
  {
    id: 1,
    title: "The Quiet Power of Thinking for Yourself",
    category: "Essays",
    author: "Ahmed Khan",
    initials: "AK",
    time: "2h ago",
    read: 4,
    likes: 248,
    comments: [
      { author: "Zainab", text: "The space between stimulus and response is everything. Loved this piece!" },
      { author: "Hassan", text: "Deeply resonant in the age of constant algorithmic feeds." }
    ],
    excerpt: "In a world that never stops broadcasting opinions, independent thinking becomes a subtle and vital freedom.",
    image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=80",
    body: "In a world that never stops telling us what to think, choosing our own thoughts can feel like a quiet act of courage.\n\nIndependent thinking does not mean rejecting every consensus around us. It simply means being curious enough to ask why, patient enough to examine nuance, and honest enough to adjust our convictions when truth asks us to.\n\nPerhaps the most practical thing we can do every day is pause before agreeing, reacting, or reposting. That brief silence creates room for a genuine insight to take shape."
  },
  {
    id: 2,
    title: "خاموشی کی اپنی ایک زبان ہوتی ہے",
    category: "Urdu",
    author: "Mariam Noor",
    initials: "MN",
    time: "4h ago",
    read: 3,
    likes: 185,
    comments: [
      { author: "Bilal", text: "بہت خوبصورت تحریر۔ خاموشی کے اس پہلو کو بہت سادگی سے بیان کیا۔" }
    ],
    excerpt: "کبھی کبھی خاموش رہنا بھی اپنے اندر ایک مکمل اور گہری گفتگو رکھتا ہے۔",
    image: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=80",
    body: "کبھی کبھی خاموش رہنا بھی اپنے اندر ایک مکمل گفتگو رکھتا ہے۔ ہر بات کو لفظوں کا پیرہن پہنانا ضروری نہیں ہوتا؛ کچھ احساسات وقت، فاصلے اور خاموشی میں زیادہ صاف اور پر اثر سنائی دیتے ہیں۔\n\nشاید اصل دانائی یہ نہیں کہ ہم ہر موڑ پر اپنی آواز ثابت کریں، بلکہ یہ ہے کہ ہم جانیں کہ کب خاموش رہ کر کسی دوسرے کے دل کی بات کو سننے اور سمجھنے کی جگہ دینی ہے۔"
  },
  {
    id: 3,
    title: "Small Habits, Quiet Revolutions",
    category: "Life",
    author: "Sara Malik",
    initials: "SM",
    time: "6h ago",
    read: 5,
    likes: 142,
    comments: [],
    excerpt: "How unremarkable micro-actions steadily architect a life of meaning and peace.",
    image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=80",
    body: "We tend to imagine meaningful change as an explosion: a grand epiphany, a dramatic resignation, a total overhaul overnight.\n\nIn truth, life reshapes itself in whispers: a chapter absorbed before morning noise begins, a quiet ten-minute walk without headphones, an unprompted message sent to remind someone they matter.\n\nSmall habits gently bridge the gap between who we are right now and who we quietly yearn to be."
  },
  {
    id: 4,
    title: "A Road Trip Through the Karakoram",
    category: "Travel",
    author: "Ali Raza",
    initials: "AR",
    time: "8h ago",
    read: 6,
    likes: 310,
    comments: [{ author: "Usman", text: "Passu cones in autumn are pure magic." }],
    excerpt: "Granite giants, jade rivers, and the rare stillness that makes time dissolve.",
    image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80",
    body: "The northern highway loosens something deep inside your chest. As the bustling towns surrender to steep granite ridges, your smartphone screen gradually feels like a distant toy.\n\nWe sat beside the river near Hunza with nowhere to hurry. A full afternoon melted into dusk. In places as vast as this, you are gifted with the one luxury modern life denies us: space to simply observe."
  },
  {
    id: 5,
    title: "The Future of Work Is Empathy, Not Code",
    category: "Technology",
    author: "Ayesha Khan",
    initials: "AY",
    time: "1d ago",
    read: 5,
    likes: 95,
    comments: [],
    excerpt: "As synthesis and computation automate, judgment and human care become the rarest capital.",
    image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1000&q=80",
    body: "The true question regarding generative intelligence is never just what machines can replicate; it is what uniquely human capabilities shine once mechanical tasks fall away.\n\nComputation offers scale, but empathy provides orientation. The next era will reward those who can listen between the lines, hold space for ambiguity, and weave moral clarity into technical power."
  }
];

// Safe storage (published pages may have empty/blocked storage)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function parseJSON(s, fallback) { try { const v = JSON.parse(s); return v == null ? fallback : v; } catch (e) { return fallback; } }

// Offline image placeholder (remote images are blocked on hosted pages)
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"></svg>');
document.addEventListener('error', function (e) {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.src !== PLACEHOLDER) { t.src = PLACEHOLDER; }
}, true);

// App State with LocalStorage Persistence
let stories = parseJSON(store.get("zuzu_stories"), defaultStories);
let savedIds = new Set(parseJSON(store.get("zuzu_saved"), []));
let likedIds = new Set(parseJSON(store.get("zuzu_likes"), []));
let activeView = "Home";
let activeTopic = "All";
let sortBy = "recent";

function saveStorage() {
  store.set("zuzu_stories", JSON.stringify(stories));
  store.set("zuzu_saved", JSON.stringify([...savedIds]));
  store.set("zuzu_likes", JSON.stringify([...likedIds]));
}

// Elements
const feedContainer = document.getElementById("feedContainer");
const searchInput = document.getElementById("searchInput");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalContent = document.getElementById("modalContent");
const toastEl = document.getElementById("toast");

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag] || tag));
}

// Filter and Sort Stories
function getFilteredStories() {
  const query = searchInput.value.trim().toLowerCase();
  let list = stories.filter(story => {
    const matchesTopic = activeTopic === "All" || story.category.toLowerCase() === activeTopic.toLowerCase();
    const matchesSearch = !query || [story.title, story.excerpt, story.author, story.category, story.body].join(" ").toLowerCase().includes(query);
    const matchesView = activeView !== "Library" || savedIds.has(story.id);
    return matchesTopic && matchesSearch && matchesView;
  });

  if (sortBy === "popular") list.sort((a, b) => b.likes - a.likes);
  else if (sortBy === "readTime") list.sort((a, b) => a.read - b.read);
  else list.sort((a, b) => b.id - a.id);

  return list;
}

// Render Feed
function renderFeed() {
  const items = getFilteredStories();
  
  if (!items.length) {
    feedContainer.innerHTML = `
      <div style="text-align:center;padding:70px 20px;color:var(--muted)">
        <div style="font-size:36px;margin-bottom:10px">📖</div>
        <h3 style="color:var(--ink);margin-bottom:6px">No stories found</h3>
        <p>Try clearing your search term or exploring a different category.</p>
      </div>`;
    return;
  }

  feedContainer.innerHTML = items.map(s => {
    const isUrdu = s.category === "Urdu" || /[\u0600-\u06FF]/.test(s.title);
    const isLiked = likedIds.has(s.id);
    const isSaved = savedIds.has(s.id);

    return `
      <article class="story ${isUrdu ? 'urdu-text' : ''}">
        <div class="cover-box">
          <img src="${escapeHtml(s.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">
        </div>
        <div>
          <div class="story-meta">
            <span class="tag">${escapeHtml(s.category)}</span>
            <span>·</span>
            <span>${s.read} min read</span>
          </div>
          <h3><a href="#" data-read="${s.id}">${escapeHtml(s.title)}</a></h3>
          <p>${escapeHtml(s.excerpt)}</p>
          <div class="byline">
            <span class="mini-avatar"${s.avatar ? ` style="background:url('${encodeURI(s.avatar).replace(/'/g, "%27")}') center/cover;color:transparent"` : ''}>${escapeHtml(s.initials)}</span>
            <span>${escapeHtml(s.author)}</span>
            <span>·</span>
            <span>${s.time}</span>
            <div class="story-actions">
              <button class="action-btn ${isLiked ? 'active' : ''}" data-like="${s.id}" title="Applause">
                <svg viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}"><path d="M7 11v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3m0 0a4 4 0 0 0 4-4V4a2 2 0 0 1 4 0v3a2 2 0 0 0 2 2h3a2 2 0 0 1 2 2v2a6 6 0 0 1-2 4.4L18 20"/></svg>
                <span>${s.likes}</span>
              </button>
              <button class="action-btn action-comments" data-read="${s.id}" title="Comments">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>${s.comments ? s.comments.length : 0}</span>
              </button>
              <button class="action-btn" data-share="${s.id}" title="Share story"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
              <button class="action-btn ${isSaved ? 'active' : ''}" data-save="${s.id}" title="Save story">
                <svg viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

// Modal System
function openModal(html) {
  modalContent.innerHTML = html;
  modalBackdrop.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  modalBackdrop.classList.remove("open");
  document.body.style.overflow = "";
}

// Story Reader
function readStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) return;

  const isUrdu = story.category === "Urdu" || /[\u0600-\u06FF]/.test(story.title);
  const isSaved = savedIds.has(story.id);
  const isLiked = likedIds.has(story.id);

  const commentsMarkup = (story.comments || []).map(c => `
    <div class="comment-card">
      <div class="comment-card-head"><span>${escapeHtml(c.author)}</span></div>
      <div>${escapeHtml(c.text)}</div>
    </div>
  `).join("") || `<p style="color:var(--muted);font-size:14px">Be the first to share your thoughts.</p>`;

  openModal(`
    <div class="modal-head">
      <span class="tag">${escapeHtml(story.category)}</span>
      <button class="btn-close" id="closeModalBtn">✕</button>
    </div>
    
    <article class="${isUrdu ? 'urdu-text' : ''}">
      <h1 class="article-title">${escapeHtml(story.title)}</h1>
      <div class="byline" style="margin-bottom:18px">
        <span class="mini-avatar"${story.avatar ? ` style="background:url('${encodeURI(story.avatar).replace(/'/g, "%27")}') center/cover;color:transparent"` : ''}>${escapeHtml(story.initials)}</span>
        <span>${escapeHtml(story.author)}</span>
        <span>·</span>
        <span>${story.read} min read</span>
        <span>·</span>
        <span>${story.time}</span>
      </div>
      
      <img class="article-cover" src="${escapeHtml(story.image)}" alt="" referrerpolicy="no-referrer">
      
      <div class="article-content ${isUrdu ? 'urdu-text' : ''}">${escapeHtml(story.body)}</div>
      
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin:32px 0;align-items:center;border-top:1px solid var(--line);padding-top:20px">
        <button class="primary-btn" data-like="${story.id}">
          <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="${isLiked ? 'white' : 'none'}"><path d="M7 11v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3m0 0a4 4 0 0 0 4-4V4a2 2 0 0 1 4 0v3a2 2 0 0 0 2 2h3a2 2 0 0 1 2 2v2a6 6 0 0 1-2 4.4L18 20"/></svg>
          ${story.likes} Applaud
        </button>
        <button class="secondary-btn" data-share="${story.id}">Share ↗</button>
        <button class="secondary-btn" data-save="${story.id}">
          ${isSaved ? 'Saved in Library ✓' : 'Save Story'}
        </button>
      </div>

      <!-- Comments Section -->
      <section class="comments-wrap">
        <h3>Responses (${story.comments ? story.comments.length : 0})</h3>
        <div class="comment-list">${commentsMarkup}</div>
        <form id="commentForm" data-story-id="${story.id}" style="display:flex;gap:10px">
          <input required placeholder="Write a thoughtful reply..." style="flex:1;padding:12px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--card-bg)">
          <button type="submit" class="primary-btn">Reply</button>
        </form>
      </section>
    </article>
  `);
}

// Story Writer Modal
function openWriter() {
  openModal(`
    <div class="modal-head">
      <h2>Publish an Essay or Story</h2>
      <button class="btn-close" id="closeModalBtn">✕</button>
    </div>
    <form id="writerForm">
      <div class="form-field">
        <label>STORY TITLE</label>
        <input id="postTitle" required placeholder="What idea is on your mind?" maxlength="120">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-field">
          <label>TOPIC</label>
          <select id="postCategory">
            <option>Essays</option>
            <option>Stories</option>
            <option>Technology</option>
            <option>Life</option>
            <option>Culture</option>
            <option>Travel</option>
            <option>Urdu</option>
          </select>
        </div>
        <div class="form-field">
          <label>COVER IMAGE URL (OPTIONAL)</label>
          <input id="postImage" type="url" placeholder="Paste an image link (https://…) — 3:2 works best">
        </div>
      </div>
      <div class="form-field">
        <label>STORY BODY</label>
        <textarea id="postBody" required placeholder="Write your words here... (Urdu supported)"></textarea>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
        <button type="button" class="secondary-btn" id="closeModalBtn2">Cancel</button>
        <button type="submit" class="primary-btn">Publish to ZUZU ↗</button>
      </div>
    </form>
  `);
}

// Navigation Views
function setView(view) {
  activeView = view;
  document.querySelectorAll(".nav button, .bottom-nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === view);
  });

  const headers = {
    Home: ["Better thoughts.<br>Brighter days.", "Stories, essays, and deep reflections from voices around the globe.", "Latest stories"],
    Library: ["Your Library", "The stories and reflections you have bookmarked for quiet moments.", "Saved articles"],
    Account: ["Your Space", "Manage your published writings and reading history.", "Your profile overview"],
    Settings: ["Preferences", "Tune your reading ambiance and typography.", "Display & Theme"]
  };

  if (view === "Write") {
    openWriter();
    return;
  }

  const [t1, t2, fTitle] = headers[view] || headers.Home;
  document.getElementById("pageTitle").innerHTML = t1;
  document.getElementById("pageSubtitle").textContent = t2;
  document.getElementById("feedTitle").textContent = fTitle;
  document.getElementById("topicBar").style.display = (view === "Account" || view === "Settings") ? "none" : "flex";

  if (view === "Account") {
    renderAccountPage();
    return;
  }
  if (view === "Settings") {
    renderSettingsPage();
    return;
  }

  renderFeed();
}

function renderAccountPage() {
  const myStories = stories.filter(s => s.author === "Ahmed Khan");
  feedContainer.innerHTML = `
    <div style="background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin-bottom:28px;display:flex;align-items:center;gap:20px">
      <div class="avatar" style="width:64px;height:64px;font-size:22px">AK</div>
      <div>
        <h2 style="font-size:22px">Ahmed Khan</h2>
        <p style="color:var(--muted);font-size:13.5px">Writer · Observer · Curious Mind</p>
        <div style="margin-top:6px;font-size:13px;font-weight:700;color:var(--primary)">${myStories.length} published stories · ${savedIds.size} saved</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <h3>Your Published Writings</h3>
      <button class="primary-btn" onclick="openWriter()">Write New Story</button>
    </div>
  `;
  renderFeed();
}

function renderSettingsPage() {
  feedContainer.innerHTML = `
    <div style="max-width:580px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px">
      <h3 style="margin-bottom:18px">Reading Ambiance</h3>
      
      <div class="form-field">
        <label>COLOR SCHEME</label>
        <select id="themeSelect" class="sort-select" style="border:1px solid var(--line);padding:10px;border-radius:var(--radius-md);width:100%">
          <option value="light">Classic Clean White</option>
          <option value="sepia">Warm Book Sepia</option>
          <option value="dark">Midnight Dark</option>
        </select>
      </div>

      <div class="form-field" style="margin-top:20px">
        <label>PRIMARY ACCENT COLOR</label>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="swatch" data-accent="#7652ef" style="width:34px;height:34px;border-radius:50%;background:#7652ef"></button>
          <button class="swatch" data-accent="#109856" style="width:34px;height:34px;border-radius:50%;background:#109856"></button>
          <button class="swatch" data-accent="#d9534f" style="width:34px;height:34px;border-radius:50%;background:#d9534f"></button>
          <button class="swatch" data-accent="#2c82c9" style="width:34px;height:34px;border-radius:50%;background:#2c82c9"></button>
        </div>
      </div>

      <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)">
        ZUZU SPA Edition — High-performance reading platform with zero third-party dependencies.
      </div>
    </div>
  `;

  document.getElementById("themeSelect").value = document.documentElement.getAttribute("data-theme") || "light";
  document.getElementById("themeSelect").addEventListener("change", (e) => {
    document.documentElement.setAttribute("data-theme", e.target.value);
    store.set("zuzu_theme", e.target.value);
    showToast(`Theme switched to ${e.target.value}`);
  });
}

// Share a story (native share sheet -> clipboard fallback)
async function shareStory(id) {
  const s = stories.find(x => x.id === id);
  if (!s) return;
  const url = location.href.split('#')[0] + '#story-' + id;
  const text = s.title + ' — ' + s.author + '\n' + s.excerpt;
  try {
    if (navigator.share) { await navigator.share({ title: s.title, text, url }); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  const full = text + '\n' + url;
  try { await navigator.clipboard.writeText(full); showToast('Link copied — ready to share'); return; } catch (err) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = full; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    showToast('Link copied — ready to share');
  } catch (err) { showToast('Could not share on this device'); }
}

// Global Event Listeners
document.addEventListener("click", (e) => {
  const viewBtn = e.target.closest("[data-view]");
  if (viewBtn) {
    setView(viewBtn.dataset.view);
    return;
  }

  const topicBtn = e.target.closest("[data-topic]");
  if (topicBtn) {
    activeTopic = topicBtn.dataset.topic;
    document.querySelectorAll(".topic-btn").forEach(b => b.classList.toggle("active", b === topicBtn));
    renderFeed();
    return;
  }

  const shareBtn = e.target.closest("[data-share]");
  if (shareBtn) {
    e.preventDefault();
    shareStory(Number(shareBtn.dataset.share));
    return;
  }

  const readBtn = e.target.closest("[data-read]");
  if (readBtn) {
    e.preventDefault();
    readStory(Number(readBtn.dataset.read));
    return;
  }

  const likeBtn = e.target.closest("[data-like]");
  if (likeBtn) {
    const id = Number(likeBtn.dataset.like);
    const story = stories.find(s => s.id === id);
    if (!story) return;

    if (likedIds.has(id)) {
      likedIds.delete(id);
      story.likes--;
    } else {
      likedIds.add(id);
      story.likes++;
      showToast("Applauded story 👏");
    }
    saveStorage();
    renderFeed();
    if (modalBackdrop.classList.contains("open")) readStory(id);
    return;
  }

  const saveBtn = e.target.closest("[data-save]");
  if (saveBtn) {
    const id = Number(saveBtn.dataset.save);
    if (savedIds.has(id)) {
      savedIds.delete(id);
      showToast("Removed from library");
    } else {
      savedIds.add(id);
      showToast("Saved to reading library");
    }
    saveStorage();
    renderFeed();
    if (modalBackdrop.classList.contains("open")) readStory(id);
    return;
  }

  const swatch = e.target.closest("[data-accent]");
  if (swatch) {
    document.documentElement.style.setProperty("--primary", swatch.dataset.accent);
    document.documentElement.style.setProperty("--primary-hover", swatch.dataset.accent);
    showToast("Color accent updated");
    return;
  }

  if (e.target.id === "closeModalBtn" || e.target.id === "closeModalBtn2" || e.target === modalBackdrop) {
    closeModal();
    return;
  }

  if (e.target.closest("#themeToggle")) {
    const current = document.documentElement.getAttribute("data-theme") || "light";
    const next = current === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    store.set("zuzu_theme", next);
    showToast(`Switched to ${next} theme`);
    return;
  }

  if (e.target.id === "avatarBtn") {
    setView("Account");
    return;
  }
});

// Search and Sorting handlers
searchInput.addEventListener("input", renderFeed);
document.getElementById("sortSelect").addEventListener("change", (e) => {
  sortBy = e.target.value;
  renderFeed();
});

// Modal submit handlers
document.addEventListener("submit", (e) => {
  if (e.target.id === "writerForm") {
    e.preventDefault();
    const title = document.getElementById("postTitle").value.trim();
    const category = document.getElementById("postCategory").value;
    const image = document.getElementById("postImage").value.trim() || "";
    const body = document.getElementById("postBody").value.trim();

    const words = body.split(/\s+/).length;
    const read = Math.max(1, Math.ceil(words / 190));

    const newStory = {
      id: Date.now(),
      title,
      category,
      author: "Ahmed Khan",
      initials: "AK",
      time: "Just now",
      read,
      likes: 1,
      comments: [],
      excerpt: body.slice(0, 140) + (body.length > 140 ? "..." : ""),
      image,
      body
    };

    stories.unshift(newStory);
    likedIds.add(newStory.id);
    saveStorage();
    closeModal();
    setView("Home");
    showToast("Story successfully published!");
    return;
  }

  if (e.target.id === "commentForm") {
    e.preventDefault();
    const storyId = Number(e.target.dataset.storyId);
    const input = e.target.querySelector("input");
    const text = input.value.trim();
    if (!text) return;

    const story = stories.find(s => s.id === storyId);
    if (story) {
      if (!story.comments) story.comments = [];
      story.comments.push({ author: "Ahmed Khan", text });
      saveStorage();
      readStory(storyId);
      showToast("Response posted");
    }
  }
});

// Keyboard Shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key.toLowerCase() === "n" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    openWriter();
  }
});

// Restore Theme
const savedTheme = store.get("zuzu_theme") || "light";
document.documentElement.setAttribute("data-theme", savedTheme);

// Initial Load
renderFeed();
const deep = location.hash.match(/^#story-(\d+)$/);
if (deep) readStory(Number(deep[1]));
</script>
